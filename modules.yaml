      preserve: []
      exclude: []

  - name: ghostty
    desc: Ghostty 终端模拟器配置
    group: terminals
    doctor: true
    bin: ghostty
    config:
      source: config/terminals/ghostty
      target: ~/.config/ghostty
      strategy: copy
      writable: true
