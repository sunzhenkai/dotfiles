# 统一模块注册表 — install/config/doctor 能力与路径的真相源
# 由 scripts/modules.py / scripts/modules.sh 读取；勿再维护并行硬编码清单。
#
# 字段:
#   name       — 唯一模块名
#   desc       — 人类可读描述
#   install    — true 表示具备安装能力（由 scripts/install.sh 按名调度）
#   config     — 配置部署声明，必须显式包含:
#                source/target、strategy(copy|merge|render|symlink)、
#                writable/sensitive、target_mode（mode 为兼容别名）、
#                preserve/exclude 相对路径列表
#   doctor     — true 表示具备诊断能力（工具型模块强制；L0 或专用实现）
#   bin        — 可选，L0 doctor 用于 PATH 检查的命令名
#   os         — 可选适用 OS 集合；省略 = 全平台
#                支持具体 ID（darwin/ubuntu/…）或族名 linux（非 darwin）
#   depends_on — 可选依赖模块名列表（planner 拓扑排序）
#   group      — 可选展示分组（不影响执行顺序）
#   enabled    — 可选，false 时不参与 select_all / profile / --all；
#                显式点名（dotf <name> -i 等）仍可用
# 禁止字段: script/command/handler/function/exec/run（注册表非可执行 DSL）
# 当前显式只读 symlink allowlist：空。清单始终由下方 strategy: symlink 条目派生。
#
# 使用场景 profile 见 profiles.yaml（与 OS profile 正交）
# 非工具型（不强制 doctor）: system / homebrew / fonts

modules:
  # ---------- install-only ----------
  - name: homebrew
    desc: 安装 Homebrew 包管理器
    group: core
    depends_on: [system]
    install: true

  - name: system
    desc: 系统配置（软件源、依赖等）
    group: core
    install: true

  - name: sdk
    desc: 安装 SDK（Go/Python/Node via mise）
    group: core
    depends_on: [system]
    install: true
    doctor: true
    bin: mise

  - name: golang
    desc: 配置 Golang 环境（GOPATH 等）
    group: core
    depends_on: [sdk]
    install: true
    doctor: true
    bin: go

  - name: senv
    desc: 安装 senv 二进制工具
    group: tools
    depends_on: [golang]
    install: true
    doctor: true
    bin: senv

  - name: grepom
    desc: 安装 grepom 多仓库管理工具
    group: tools
    depends_on: [golang]
    install: true
    doctor: true
    bin: grepom

  - name: mdserve
    desc: 安装 mdserve 二进制工具
    group: tools
    depends_on: [golang]
    install: true
    doctor: true
    bin: mdserve

  - name: delta
    desc: 安装并配置 git-delta（git diff 高亮分页器）
    group: tools
    depends_on: [git]
    install: true
    doctor: true
    bin: delta

  - name: fonts
    desc: 安装字体（Maple Mono NF CN）
    group: desktop
    install: true

  - name: npm
    desc: 安装 npm 全局包（docsify-cli 等）
    group: tools
    depends_on: [sdk]
    install: true
    doctor: true
    bin: npm

  - name: dws
    desc: 安装 DingTalk Workspace CLI
    group: 办公
    depends_on: [sdk]
    install: true
    doctor: true
    bin: dws

  - name: lark-cli
    desc: 安装飞书 / Lark CLI 二进制（npm -g @larksuite/cli；skill 走内嵌 skills read）
    group: 办公
    depends_on: [sdk]
    install: true
    doctor: true
    bin: lark-cli

  - name: ocr
    desc: Open Code Review CLI + 配置（MiniMax-M3）
    group: tools
    depends_on: [sdk]
    install: true
    doctor: true
    bin: ocr
    config:
      source: config/tools/ocr
      target: ~/.opencodereview
      strategy: merge
      writable: true
      sensitive: true
      target_mode: "0700"
      preserve: []
      exclude: []

  - name: trae-cli
    desc: 安装 Trae CLI
    group: agents
    install: true
    doctor: true

  - name: dsh
    desc: 安装 DeepSeek Harness CLI（dsh，npm @deepseek-ai/dsh）
    group: agents
    depends_on: [sdk]
    install: true
    doctor: true
    bin: dsh

  - name: vcpkg
    desc: 安装 vcpkg C++ 包管理器
    group: tools
    install: true
    doctor: true
    bin: vcpkg

  - name: cpp-dev
    desc: C/C++ 工具链（llvm/gcc/cmake/ninja 等，可选）
    group: dev
    install: true
    doctor: true
    bin: cmake       # L0 doctor 用 cmake 代表整个工具链
    enabled: false   # 不进 full/profile/--all；dotf install cpp-dev 显式装

  - name: ossutil
    desc: 安装 ossutil 2.0（阿里云 OSS CLI）
    group: tools
    install: true
    doctor: true
    bin: ossutil

  - name: aws
    desc: 安装 AWS CLI v2
    group: tools
    install: true
    doctor: true
    bin: aws

  - name: aliyun
    desc: 安装阿里云 CLI
    group: tools
    install: true
    doctor: true
    bin: aliyun

  - name: gcp
    desc: 安装 Google Cloud CLI + gke-gcloud-auth-plugin
    group: tools
    install: true
    doctor: true
    bin: gcloud

  - name: d2
    desc: 安装 D2 图描述语言
    group: tools
    install: true
    doctor: true
    bin: d2

  # ---------- dual: install + config ----------
  - name: git
    desc: Git 版本控制
    group: core
    depends_on: [system]
    install: true
    doctor: true
    bin: git
    config:
      source: config/tools/git
      target: ~/.config/git
      strategy: copy
      writable: true
      sensitive: false
      target_mode: "0755"
      preserve: []
      exclude: []

  - name: agents
    desc: agents CLI 工具包 + skills/MCP 同步
    group: agents
    # install 由 planner 展开为各单工具动作（见 planner.AGENTS_INSTALL_BUNDLE）
    install: true
    doctor: true
    config:
      source: agents/skills-defaults.yaml
      target: ~/.config/dotf/managed/agents-skills-defaults.yaml
      strategy: render
      writable: true
      sensitive: true
      target_mode: "0600"
      preserve: []
      exclude: []

  - name: cursor
    desc: Cursor Agent CLI + MCP 配置
    group: agents
    install: true
    doctor: true
    bin: cursor
    config:
      source: agents/vendors/cursor/mcp.json
      target: ~/.cursor/mcp.json
      strategy: render
      writable: true
      sensitive: true
      target_mode: "0600"
      preserve: []
      exclude: []

  - name: kiro
    desc: Kiro CLI + skills/prompts/MCP 配置
    group: agents
    install: true
    doctor: true
    bin: kiro-cli
    config:
      source: agents/vendors/kiro
      target: ~/.kiro
      strategy: render
      writable: true
      sensitive: true
      target_mode: "0700"
      preserve: [skills, prompts]
      exclude: []

  - name: opencode
    desc: OpenCode CLI + 配置
    group: agents
    install: true
    doctor: true
    bin: opencode
    config:
      # 手写模板在 vendor；运行时目标为 home 真实目录（不再整目录软链）
      source: agents/vendors/opencode
      target: ~/.config/opencode
      strategy: merge
      writable: true
      sensitive: true
      target_mode: "0700"
      preserve: [node_modules, skills, commands]
      exclude: []

  - name: codex
    desc: Codex CLI + 多 provider 配置（MiniMax / NativeX / Kimi / 智谱 / SCNet）
    group: agents
    install: true
    doctor: true
    bin: codex
    config:
      source: agents/vendors/codex
      target: ~/.codex
      strategy: merge
      writable: true
      sensitive: true
      target_mode: "0700"
      preserve: [auth.json, history.jsonl, sessions, archived_sessions, log, shell_snapshots, skills, prompts, tmp, models_cache.json, version.json]
      exclude: [README.md, config.local.toml.example]

  - name: kimi-code
    desc: Kimi Code CLI + 配置
    group: agents
    install: true
    doctor: true
    bin: kimi
    config:
      source: agents/vendors/kimi-code/config.toml
      target: ~/.kimi-code/config.toml
      strategy: merge
      writable: true
      sensitive: true
      target_mode: "0600"
      preserve: []
      exclude: []

  - name: pi
    desc: Pi coding agent CLI + 配置
    group: agents
    install: true
    doctor: true
    bin: pi
    config:
      source: agents/vendors/pi
      target: ~/.pi/agent
      strategy: merge
      writable: true
      sensitive: true
      target_mode: "0700"
      preserve: [npm]
      exclude: []

  - name: zcode
    desc: ZCode CLI + 配置（~/.zcode）
    group: agents
    install: true
    doctor: true
    bin: zcode
