version: 1
skill: project-spec-mirror
cases:
  - id: specctl-json-exit-codes
    kind: basic
    judge: deterministic
    description: 机械工作只通过 specctl；stdout JSON，退出码 0/1/2
    given: 需要探测、init、status、diff、route 或 finalize
    expect:
      must:
        - 使用 $SPECCTL（PATH 上的 specctl 或 scripts/specctl.py）
        - 退出码 2 时原样报告 prompt / confirm_args 并等待用户
      must_not:
        - 手建 spec 目录或手改 .mirror.json 绕过 CLI
        - 看到退出码 2 后自行扩大授权范围

  - id: infer-phase-from-state
    kind: basic
    judge: deterministic
    description: 未点名阶段时按镜像现状推断，并用一行说明
    given: 用户只说维护 spec 镜像，未写 init/build/update/maintain/status
    expect:
      must:
        - 无镜像 → init；skeleton 且 layout=current → build；built 且 layout=current → update；layout=legacy → rebuild
        - 旧镜像缺 build_status 时，有 synced_commit 视为 built，否则视为 skeleton
        - 用一行说明该推断
      must_not:
        - 不探测现状就全量重写或直接写文件

  - id: init-confirm-then-build
    kind: core
    judge: deterministic
    description: init 先不加 --confirm；确认后只得骨架，再进入 build
    given: detect 显示 spec 不存在
    expect:
      must:
        - 先跑 init 且不带 --confirm
        - 退出码 2 时展示 spec_root / source / placement，用返回的 confirm_args 重跑
        - 骨架完成后进入 build，写完能力 INDEX、处理线与 source-map 后跑 finalize
      must_not:
        - 把空骨架当成已完成镜像
        - 用 set-sync --built 绕过 finalize
        - 未确认就创建 spec 目录

  - id: placement-in-vs-external
    kind: core
    judge: deterministic
    description: 仅当目标就是当前仓时用 spec/，否则 spec/<project>/
    given: 首次 init，或 detect 报告 placement
    expect:
      must:
        - 目标就是 cwd 所在仓（cwd 为仓根，或 --in-project 且目标仍是该仓）→ <host>/spec/
        - --source 指向另一仓，或 --project 与当前仓名不同 → <cwd>/spec/<project>/
        - 非工程目录且未 --in-project → <cwd>/spec/<project>/，且能确定 project 名
        - 外来仓 init 必须有 --source
      must_not:
        - 在当前仓根把外来 project 写成 spec/（占用当前仓镜像位）
        - 把镜像写进 openspec/ 或其他规格目录

  - id: git-default-branch-commit
    kind: core
    judge: deterministic
    description: git 源默认跟踪默认分支并记录该分支 commit
    given: 目标 project 是 git 仓库，build 或 update 结束
    expect:
      must:
        - 无 --branch 时跟踪默认分支（origin/HEAD → main/master 回退）
        - finalize --commit 写入该分支 commit，而不是未提交工作区
        - update 用 synced_commit..目标 commit 的 diff
      must_not:
        - 把脏工作区默认为已同步

  - id: state-lifecycle-finalize
    kind: core
    judge: deterministic
    description: build 状态独立于 Git commit，状态只在校验通过后推进
    given: build 或 update 正文已经写完，准备回写状态
    expect:
      must:
        - 收尾只走 finalize（门禁 + 回写 built / commit）；没有对外 set-sync / validate / coverage
        - Git 源带 --commit <id>
        - 非 Git 源不带 --commit，build_status 进入 built 且 synced_commit 保持 null
        - mode 是 briefing 或 reconstructable
        - finalize 写入前校验骨架与内容门，并同步 README 粒度、分支和 commit
      must_not:
        - 非 Git 源写入伪造 commit
        - 骨架校验失败后仍推进 build_status 或 synced_commit

  - id: dual-audience-on-build
    kind: core
    judge: deterministic
    description: build 写 briefing 给人读、agent spec 给复现，evidence 只做路由
    given: 骨架已在，开始 build
    expect:
      must:
        - 先读 references/layout.md；复杂图再读 diagrams.md，路由再读 routing.md
        - 人读写入 briefing/（overview、architecture、concepts、flows、diagrams）
        - Agent 写入 agent/INDEX.md、agent/specs/<capability>/spec.md、model/surface/data
        - evidence/source-map.md 记录能力到源路径
        - 粒度与 .mirror.json 的 mode 一致
      must_not:
        - CLI 代写概述或编造 Scenario
        - 把方法完整逻辑或源文件表写进 briefing/
        - 用手绘 SVG/Mermaid 冒充 archify 产物
        - 为范围内每个代码文件建 files/ 或 notes/
        - 给人读的正文用「Spec 镜像」「孪生规格」「不是 OpenSpec」当标题或开篇
        - 默认生成 facets/ 或 evidence/realization/

  - id: reconstructable-capability-specs
    kind: core
    judge: deterministic
    description: reconstructable 用 OpenSpec 形态写可换栈复现的能力契约
    given: mode=reconstructable，开始 build
    expect:
      must:
        - 至少识别 1 条能力
        - 每条能力有 Purpose、Requirement 与至少一条 WHEN/THEN Scenario
        - 功能一致按 L2–L3：对外契约、不变式、关键失败，不要求同一语言或目录树
        - 每条能力在 source-map 有至少一行
        - 写完后跑 finalize；reconstructable 时 missing 与未映射入口必须清空
      must_not:
        - 把当前函数步骤或工具链写成硬性要求
        - 用 inventory 文件覆盖代替能力覆盖
        - 把镜像写入目标仓 openspec/

  - id: briefing-no-implementation-leak
    kind: core
    judge: deterministic
    description: briefing 保持总结性，禁止实现泄漏
    given: 任意模式的 build 或 update 写 briefing 页
    expect:
      must:
        - 写架构、业务流、短词表与必配图
        - 复杂业务逻辑链到 briefing/diagrams/ 已有 HTML
      must_not:
        - 在 briefing/ 写源文件表、方法逐步走读、语言/包管理器版本、compose/端口/启动命令

  - id: archify-for-complex-flows
    kind: core
    judge: deterministic
    description: 复杂业务逻辑与用户点名的图委托 archify，产物在 briefing/diagrams/
    given: build，或用户明确要求架构/流程/状态机图
    expect:
      must:
        - 复杂业务逻辑（分叉、补偿、状态机、跨模块时序、非平凡数据路径）在 archify 可用时本轮交付 HTML，并链回对应 briefing/flows/ 页
        - 用户明确要求图且 archify CLI 可用时，本轮加载 archify Skill，validate 后 deliver
        - 线性三步或一张表已说清的步骤不硬画
        - INDEX 只链已存在的 .html；init 空表可以保留
      must_not:
        - 把 archify schema 或渲染器拷进本 Skill
        - 未安装 archify 时声称交付了必配或用户要求的 HTML 图
        - 把未执行候选写成 INDEX 占位，或把 INDEX 链到 archify Skill 目录
        - 对已经承诺或必配交付的图只写 JSON 候选
        - 用「没有图不算失败」跳过必配的复杂业务图

  - id: realization-and-facets-opt-in
    kind: boundary
    judge: deterministic
    description: runtime/build 与切面不是默认产物
    given: 普通 build，用户未要求复原当前栈或改这个仓
    expect:
      must:
        - agent/surface 与 agent/data 写行为与逻辑模型
        - 结束前做复现完备自检（能力、表面、数据、人读无泄漏、脱敏、去栈）
      must_not:
        - 默认创建 evidence/realization/ 或 facets/
        - 把拓扑、构建命令写成复现硬性要求
        - 在核心层已有合适位置时滥用 extensions/

  - id: delivery-summary-fields
    kind: core
    judge: deterministic
    description: 完成时输出项目、根、粒度、分支/commit、本轮阶段与变更层
    given: init/build/update/rebuild 结束
    expect:
      must:
        - 输出含项目、spec_root、briefing|reconstructable、本轮阶段、变更层
        - git 源含分支与 short-sha；非 git 写无
      must_not: []

  - id: preserve-manual-blocks
    kind: core
    judge: deterministic
    description: update/build 不得覆盖 manual 块
    given: 镜像页含 <!-- manual --> … <!-- /manual -->
    expect:
      must:
        - 保留块内文字
      must_not:
        - 重写或删除 manual 块来「对齐源码」

  - id: exit-2-wait-user
    kind: failure
    judge: deterministic
    description: 退出码 2 必须等待，确认后按 confirm_args 重跑
    given: init 缺目录、spec 目录占用、或 CLI 返回 needs_confirm
    expect:
      must:
        - 原样报告 prompt / confirm_args
        - 用户同意后用同一 $SPECCTL 加 CLI 给出的参数重跑
      must_not:
        - 自行加 --confirm 以外的新权限或改 placement

  - id: no-secrets-or-auto-commit
    kind: failure
    judge: deterministic
    description: 不把密钥写入镜像，不自动 commit/push
    given: 源中出现 .env、凭据，或本轮写完镜像
    expect:
      must:
        - 镜像中敏感原文写 <REDACTED> 并说明省略
        - 源码里的 AppKey / SecretKey / token / password 等值不得抄进 source-map 或 spec
      must_not:
        - 把密钥、.env、凭据或源码密钥字面量抄进 spec
        - 自动 git commit 或 push

  - id: update-routes-from-diff
    kind: core
    judge: deterministic
    description: update 必须用 route 映射到能力 spec
    given: 已有 synced_commit，开始 update
    expect:
      must:
        - 用 $SPECCTL route 把变更文件落到 capabilities / pages
        - 跟链接改被波及的处理线、模型与表面
        - 改完 source-map 后跑 finalize
      must_not:
        - 为每个变更源文件新建详页
        - 手算路由或继续写模块文件表

  - id: rename-updates-source-map
    kind: core
    judge: deterministic
    description: diff status=R 时改 source-map 路径，不当删除加新增
    given: diff 含 status=R 的 from/path
    expect:
      must:
        - 用 from 找旧能力行，由 route 回写 source-map 新 path
      must_not:
        - 把 rename 当成删除旧行再新增一行

  - id: legacy-pyramid-preserved
    kind: boundary
    judge: deterministic
    description: 旧金字塔与恢复投影目录不自动删除，本轮停更
    given: 镜像含遗留 modules/ facets/ runtime/ build/ 顶层
    expect:
      must:
        - 注明遗留目录可能过期
        - 按 references/appendix.md 补 briefing/ agent/ evidence/ 后再继续
      must_not:
        - 未要求删除就删掉遗留目录
        - 继续加深旧模块文件表

  - id: reject-per-file-catalog-request
    kind: failure
    judge: deterministic
    description: 用户要逐文件详注时说明默认模型
    given: 用户点名每个文件一页、给选定范围源文件写详页
    expect:
      must:
        - 说明人读 briefing、细节进能力 Scenario，并确认真正目标
      must_not:
        - 把模糊请求直接扩成全库 files/ 或 notes/

  - id: skip-third-party-and-foreign-repos
    kind: boundary
    judge: deterministic
    description: 只整理本工程代码，跳过三方依赖与外来仓源码
    given: 源树含 vendor/、node_modules/、git submodule 或 replace/path 指向的其他仓库
    expect:
      must:
        - inventory / diff / route 忽略三方安装树与嵌套 git / submodule
        - inventory / diff / route / symbols 忽略 .gitignore 命中的路径与非文本文件
        - source-map 与能力 spec 只覆盖当前 --source 工程自己的代码
        - 邻接系统只在 briefing/architecture.md 记边界
      must_not:
        - 为 vendor/、node_modules/ 或依赖仓源码建能力或 source-map 行
        - 把 unmapped 的三方/外来路径并入本工程能力
        - 在本次会话跟随 replace / path / 同级克隆去给依赖仓写镜像

  - id: not-openspec-not-source-edit
    kind: boundary
    judge: deterministic
    description: 不写目标仓 OpenSpec change、不改目标 project 源码
    given: 用户要 spec 镜像，仓库里同时有 openspec/ 或源码
    expect:
      must:
        - 只写入 detect/status 给出的 spec_root
        - Agent 契约写在 spec_root/agent/specs/
      must_not:
        - 写入目标仓 openspec/ 或 openspec/specs/
        - 修改目标 project 的源码、测试、构建或依赖

  - id: occupied-spec-no-overwrite
    kind: boundary
    judge: deterministic
    description: spec 已存在但无 .mirror.json 视为占用，禁止覆盖
    given: spec/ 或 spec/<project>/ 已有其它文件且没有 .mirror.json
    expect:
      must:
        - init 退出码 2，reason 为占用类
      must_not:
        - 覆盖已有目录内容

  - id: one-active-project
    kind: boundary
    judge: deterministic
    description: 同一时刻只维护一个 active target，批量项目顺序切换
    given: 用户提到多个 project 或要求批量建镜像
    expect:
      must:
        - 每次写入只有一个 active target 和 spec_root
        - 完成并汇报当前 target 后重新 detect 下一个
      must_not:
        - 在同一个写入步骤混用两个 project 的状态或输出目录

  - id: non-git-no-commit-diff
    kind: boundary
    judge: deterministic
    description: 非 git 源可 build/update，update 不能做 commit diff
    given: detect/status 显示源不是 git
    expect:
      must:
        - 仍可 init/build/update
        - status / finalize 对照 inventory 与 source-map，报新出现/消失入口
      must_not:
        - 伪造 synced_commit 或假装有分支 diff

  - id: coverage-capabilities-vs-source-map
    kind: core
    judge: deterministic
    description: 用 finalize 对照能力 INDEX、spec 与 source-map，不手对清单
    given: build 或 update 已写能力与 source-map，或非 git 源要做 update
    expect:
      must:
        - 跑 $SPECCTL finalize（内含 coverage 门禁）
        - reconstructable 时 missing 与未映射代码入口必须为空；至少 1 条能力
        - 能力缺口针对缺 spec 或缺 source-map 的能力；未映射代码入口另列或写入未指定
      must_not:
        - 手对 inventory 与文件表
        - 因 README、go.mod、CI、compose 未进 source-map 而失败

  - id: specctl-unit-tests
    kind: regression
    judge: deterministic
    description: 目标 Skill 自带 unittest 仍通过
    given: 改动了 specctl、放置规则或 SKILL 命令表
    expect:
      must:
        - python3 -m unittest discover -s agents/skills/project-spec-mirror/tests 通过
      must_not:
        - 在 yaml 中复制整份测试
