version: 1
skill: project-spec-mirror
cases:
  - id: specctl-json-exit-codes
    kind: basic
    judge: deterministic
    description: 机械工作只通过 specctl；stdout JSON，退出码 0/1/2
    given: 需要探测、init、清单、coverage、diff、回写同步指针或校验骨架
    expect:
      must:
        - 使用 $SPECCTL（PATH 上的 specctl 或 scripts/specctl.py）
        - 退出码 2 时原样报告 prompt / confirm_args 并等待用户
      must_not:
        - 手建 spec 目录或手改 .mirror.json 绕过 CLI
        - 看到退出码 2 后自行扩大授权范围

  - id: infer-phase-from-state
    kind: basic
    judge: deterministic
    description: 未点名阶段时按镜像现状推断，并用一行说明
    given: 用户只说维护 spec 镜像，未写 init/build/update/maintain/status
    expect:
      must:
        - 无镜像 → init；build_status=skeleton → build；build_status=built → update；只改词条 → maintain
        - 旧镜像缺 build_status 时，有 synced_commit 视为 built，否则视为 skeleton
        - 用一行说明该推断
      must_not:
        - 不探测现状就全量重写或直接写文件

  - id: init-confirm-then-build
    kind: core
    judge: deterministic
    description: init 先不加 --confirm；确认后只得骨架，再进入 build
    given: detect 显示 spec 不存在
    expect:
      must:
        - 先跑 init 且不带 --confirm
        - 退出码 2 时展示 spec_root / source / placement，用返回的 confirm_args 重跑
        - 骨架完成后进入 build，写完文件表后跑 coverage，再 set-sync 与 validate
      must_not:
        - 把空骨架当成已完成镜像
        - 未确认就创建 spec 目录

  - id: placement-in-vs-external
    kind: core
    judge: deterministic
    description: 仅当目标就是当前仓时用 spec/，否则 spec/<project>/
    given: 首次 init，或 detect 报告 placement
    expect:
      must:
        - 目标就是 cwd 所在仓（cwd 为仓根，或 --in-project 且目标仍是该仓）→ <host>/spec/
        - --source 指向另一仓，或 --project 与当前仓名不同 → <cwd>/spec/<project>/
        - 非工程目录且未 --in-project → <cwd>/spec/<project>/，且能确定 project 名
        - 外来仓 init 必须有 --source
      must_not:
        - 在当前仓根把外来 project 写成 spec/（占用当前仓镜像位）
        - 把镜像写进 openspec/ 或其他规格目录

  - id: git-default-branch-commit
    kind: core
    judge: deterministic
    description: git 源默认跟踪默认分支并记录该分支 commit
    given: 目标 project 是 git 仓库，build 或 update 结束
    expect:
      must:
        - 无 --branch 时跟踪默认分支（origin/HEAD → main/master 回退）
        - set-sync 写入该分支 commit，而不是未提交工作区
        - update 用 synced_commit..目标 commit 的 diff
      must_not:
        - 把脏工作区默认为已同步

  - id: state-lifecycle-finalize
    kind: core
    judge: deterministic
    description: build 状态独立于 Git commit，状态只在校验通过后推进
    given: build 或 update 正文已经写完，准备回写状态
    expect:
      must:
        - Git 源用 set-sync --built --commit <id>
        - 非 Git 源用 set-sync --built，build_status 进入 built 且 synced_commit 保持 null
        - mode=concise 时 detail_level 为 null；mode=detailed 时为 complete|important|lightweight
        - set-sync 写入前校验骨架，并同步 README 粒度、文件粒度、分支和 commit
      must_not:
        - 非 Git 源写入伪造 commit
        - 骨架校验失败后仍推进 build_status 或 synced_commit
        - 接受 concise + 非 null detail_level

  - id: pyramid-knowledge-on-build
    kind: core
    judge: deterministic
    description: build 按金字塔写正文并维护概念、实体、处理线
    given: 骨架已在，开始 build
    expect:
      must:
        - 先读 references/layout.md、modes.md、knowledge.md、projections.md、facets.md、diagrams.md、routing.md
        - 从上往下写 README / overview / context / surface / data / runtime / build / facets / concepts / entities / flows / modules
        - 模块 README 含「根」表与「文件」表
        - 切片不必等全部契约写完
        - 粒度与 .mirror.json 的 mode 一致：detailed 加深已有页，不是每文件一页
        - detailed 同时使用 detail_level，未指定时为 important
      must_not:
        - CLI 代写概述或编造流程、契约、灰度方案
        - 下层重复上层已经说清的论点
        - 用手绘 SVG/Mermaid 冒充 archify 产物
        - 为范围内每个代码文件建 files/ 或 notes/

  - id: facets-and-archify
    kind: core
    judge: deterministic
    description: 维护适用切面；用户要求的图表委托 archify，产物在 diagrams/
    given: build，或用户明确要求模块地图/切片路径/状态机图
    expect:
      must:
        - 保留 facets 下 SOURCE/CONTRACT/SLICE/VERIFY/TRAFFIC 入口；适用项写事实，不适用项写证据
        - 切片生命周期从 identified 起写，不跳步假装 migrated
        - 用户明确要求图且 archify CLI 可用时，本轮加载 archify Skill，validate 后 deliver，HTML 写入 diagrams/<slug>.html
        - Agent 主动候选先判断相对文字的增益；多图或高成本范围先让用户选择
        - INDEX 只链已存在的 .html；init 空表可以保留
      must_not:
        - 把 archify schema 或渲染器拷进本 Skill
        - 未安装 archify 时声称交付了用户要求的 HTML 图
        - 把 PHP/Go 写死为唯一对照语言对
        - 把未执行候选写成 INDEX 占位，或把 INDEX 链到 archify Skill 目录
        - 对已经承诺交付的图只写 JSON 候选

  - id: recovery-projections-runnable
    kind: core
    judge: deterministic
    description: 维护五层恢复投影；验收是只凭镜像能重建可运行系统
    given: 骨架已在，开始 build 或已有镜像缺恢复投影
    expect:
      must:
        - 保留 context/ data/ surface/（含 config.md） runtime/ build/ 的稳定 INDEX
        - 适用能力写到可恢复；不适用能力写判断依据和证据路径
        - 结束前做恢复完备自检（适用性、边界、表面、数据、拓扑、再生、脱敏）
        - 缺骨架时先补这六个文件再改正文
      must_not:
        - 把存储细节写进实体页、把进程拓扑写进模块页、把配置值原文写入镜像
        - 把 contracts/runtime.md 当成部署拓扑页
        - 在核心层已有合适位置时滥用 extensions/

  - id: delivery-summary-fields
    kind: core
    judge: deterministic
    description: 完成时输出项目、根、粒度、分支/commit、本轮阶段与变更层
    given: init/build/update/maintain 结束
    expect:
      must:
        - 输出含项目、spec_root、concise|detailed、本轮阶段、变更层
        - git 源含分支与 short-sha；非 git 写无
      must_not: []

  - id: preserve-manual-blocks
    kind: core
    judge: deterministic
    description: update/build 不得覆盖 manual 块
    given: 镜像页含 <!-- manual --> … <!-- /manual -->
    expect:
      must:
        - 保留块内文字
      must_not:
        - 重写或删除 manual 块来「对齐源码」

  - id: exit-2-wait-user
    kind: failure
    judge: deterministic
    description: 退出码 2 必须等待，确认后按 confirm_args 重跑
    given: init 缺目录、spec 目录占用、或 CLI 返回 needs_confirm
    expect:
      must:
        - 原样报告 prompt / confirm_args
        - 用户同意后用同一 $SPECCTL 加 CLI 给出的参数重跑
      must_not:
        - 自行加 --confirm 以外的新权限或改 placement

  - id: no-secrets-or-auto-commit
    kind: failure
    judge: deterministic
    description: 不把密钥写入镜像，不自动 commit/push
    given: 源中出现 .env、凭据，或本轮写完镜像
    expect:
      must:
        - 镜像中敏感原文写 <REDACTED> 并说明省略
        - 源码里的 AppKey / SecretKey / token / password 等值不得抄进文件表或符号说明
      must_not:
        - 把密钥、.env、凭据或源码密钥字面量抄进 spec
        - 自动 git commit 或 push

  - id: detailed-deepens-pages-not-files-tree
    kind: core
    judge: deterministic
    description: 详尽加深模块/实体/流/契约，不为每个代码文件建页
    given: mode=detailed，开始 build 或从 concise 升级
    expect:
      must:
        - 加深模块 README 的行为承载符号（核心方法写完整逻辑）、实体字段、处理线步骤、可追溯契约
        - 模块阅读叶子是 README 文件表
        - 测试方法只简述，complete 亦然
        - symbols 只作候选，不声称能证明全部方法或变量完整覆盖
      must_not:
        - 为范围内每个代码文件建 files/ 或 notes/
        - 把路径中的 / 拍成 __ 作为页名

  - id: detailed-file-granularity-choice
    kind: core
    judge: deterministic
    description: 详尽模式选择代码证据粒度，并持久化 important 写深范围
    given: mode=detailed，开始 build 或从 concise 升级
    expect:
      must:
        - 提供 complete、important、lightweight 三个选项
        - 未指定时使用 important
        - complete 覆盖 inventory 全部文件并深入行为承载符号；测试和纯机械文件只简述
        - important 覆盖范围内文件，对 important_paths 写深，其余简述
        - lightweight 代码证据轻量，但领域、流程、契约和投影仍写深
        - 将选择保存为 detail_level，将 important 选择保存为 important_paths，并在后续 update 中沿用
        - 写完文件表后跑 coverage；important/complete 的 missing 必须清空
      must_not:
        - 把 important 的核心方法只写成一句话职责
        - 把 symbols 候选当作方法全集证明
        - 因路径在 important_paths 就自动建立 notes/
        - 为测试方法写完整逻辑
        - 为每个文件建立独立规格页

  - id: hotspot-notes-need-scope
    kind: failure
    judge: deterministic
    description: 热点详注未给路径时先问，未同意不批量建 notes
    given: 用户要热点详注或「给这些文件写细」，未给路径或候选将超过 15 个；或 detail_level≠complete 的仓
    expect:
      must:
        - 先问范围并建议切片入口
        - 默认按约 15 个文件一批；更大具体范围需用户明确确认并说明成本
        - detail_level=complete 必须按 modes.md 5 类触发条件清单枚举 ≥5 篇 notes/
      must_not:
        - 未同意就批量建 notes/（detail=complete 不在此限）
        - 用 inventory.file_count > 80 作为是否写详页的门禁

  - id: update-routes-from-diff
    kind: core
    judge: deterministic
    description: update 必须用 route 映射到模块页，不按一文件一详页对号入座
    given: 已有 synced_commit，开始 update
    expect:
      must:
        - 用 $SPECCTL route 把变更文件落到模块 README
        - 跟链接改被波及的实体/处理线/切面
        - 改完文件表后跑 coverage
      must_not:
        - 为每个变更源文件新建或重写 files/ 详页

  - id: rename-updates-file-table
    kind: core
    judge: deterministic
    description: diff status=R 时改文件表路径，不当删除加新增
    given: diff 含 status=R 的 from/path
    expect:
      must:
        - 用 from 找旧模块行，改成新 path
        - 已有 notes/<from>.md 则改名为 notes/<path>.md
      must_not:
        - 把 rename 当成删除旧页再新增一页

  - id: legacy-files-dir-preserved
    kind: boundary
    judge: deterministic
    description: 已有 modules/*/files/ 不自动删除，本轮停更
    given: 镜像含遗留 files/ 详页，本轮 update 或 build
    expect:
      must:
        - 在模块 README 注明遗留 files/ 可能过期
        - 停更这些详页
      must_not:
        - 未要求删除就删掉 files/
        - 把遗留 files/ 全量搬成 notes/

  - id: complete-mode-notes-mandatory
    kind: failure
    judge: deterministic
    description: detail_level=complete 必须按 5 类触发条件建 notes/，不是 opt-in
    given: specctl init 用了 --mode detailed --detail-level complete；build 进入 modules/ 阶段
    expect:
      must:
        - spec/<group>/<repo>/modules/<m>/notes/*.md 至少存在 5 篇
        - 至少覆盖跨文件契约 / 一致性失败路径差异 / race 分析 / 监控盲区 / 框架宏约束 5 类触发条件中的 ≥3 类
        - 至少 1 篇命名是 topic（易踩坑的概念）而非源相对路径
        - build 步骤末尾曾 grep 同 group 已镜像仓的 modules/*/notes/ 主题做参考（输出 grep 结果或留 1 行说明）
      must_not:
        - 把每个源文件做成 notes/ 一页一页（"一文件一详页"反模式）
        - 把跨文件契约、易踩坑设计选择塞进模块 README 而不是 notes/
        - 假设 detail=complete 下 notes/ 仍 opt-in

  - id: reject-per-file-catalog-request
    kind: failure
    judge: deterministic
    description: 用户要逐文件详注时说明默认模型并确认具体范围与成本
    given: 用户点名每个文件一页、给选定范围源文件写详页
    expect:
      must:
        - 说明模块 README 是默认阅读单位，确认具体范围、预计页数和维护成本
      must_not:
        - 把模糊请求直接扩成全库 files/ 或 notes/

  - id: skip-third-party-and-foreign-repos
    kind: boundary
    judge: deterministic
    description: 只整理本工程代码，跳过三方依赖与外来仓源码
    given: 源树含 vendor/、node_modules/、git submodule 或 replace/path 指向的其他仓库
    expect:
      must:
        - inventory / diff / route 忽略三方安装树与嵌套 git / submodule
        - inventory / diff / route / symbols 忽略 .gitignore 命中的路径与非文本文件
        - 模块、文件表、notes/、概念与切片只覆盖当前 --source 工程自己的代码
        - 邻接系统只在 context/ 记边界；包名与约束只在 build/ 点到为止
      must_not:
        - 为 vendor/、node_modules/ 或依赖仓源码建模块、文件表行或 notes/
        - 为 .gitignore 命中的路径或二进制资源建模块、文件表行或 notes/
        - 把 unmapped 的三方/外来路径并入本工程模块
        - 在本次会话跟随 replace / path / 同级克隆去给依赖仓写金字塔

  - id: not-openspec-not-source-edit
    kind: boundary
    judge: deterministic
    description: 不写 OpenSpec、不改目标 project 源码
    given: 用户要 spec 镜像，仓库里同时有 openspec/ 或源码
    expect:
      must:
        - 只写入 detect/status 给出的 spec_root
      must_not:
        - 写入 openspec/ 或 specs/
        - 修改目标 project 的源码、测试、构建或依赖

  - id: occupied-spec-no-overwrite
    kind: boundary
    judge: deterministic
    description: spec 已存在但无 .mirror.json 视为占用，禁止覆盖
    given: spec/ 或 spec/<project>/ 已有其它文件且没有 .mirror.json
    expect:
      must:
        - init 退出码 2，reason 为占用类
      must_not:
        - 覆盖已有目录内容

  - id: one-active-project
    kind: boundary
    judge: deterministic
    description: 同一时刻只维护一个 active target，批量项目顺序切换
    given: 用户提到多个 project 或要求批量建镜像
    expect:
      must:
        - 每次写入只有一个 active target 和 spec_root
        - 完成并汇报当前 target 后重新 detect 下一个
      must_not:
        - 在同一个写入步骤混用两个 project 的状态或输出目录

  - id: non-git-no-commit-diff
    kind: boundary
    judge: deterministic
    description: 非 git 源可 build/maintain，update 不能做 commit diff
    given: detect/status 显示源不是 git
    expect:
      must:
        - 仍可 init/build/maintain
        - update 跑 coverage 对照文件表并说明限制
      must_not:
        - 伪造 synced_commit 或假装有分支 diff

  - id: coverage-file-table-vs-inventory
    kind: core
    judge: deterministic
    description: 用 coverage 对照 inventory 与模块文件表，不手对清单
    given: build 或 update 已写模块文件表，或非 git 源要做 update
    expect:
      must:
        - 跑 $SPECCTL coverage
        - detailed + important/complete 时 missing 必须为空再 set-sync
        - missing 只要求范围内代码文件；可用目录范围覆盖子路径
      must_not:
        - 手对 inventory 与文件表
        - 因 README、go.mod、CI、compose 未进文件表而失败

  - id: specctl-unit-tests
    kind: regression
    judge: deterministic
    description: 目标 Skill 自带 unittest 仍通过
    given: 改动了 specctl、放置规则或 SKILL 命令表
    expect:
      must:
        - python3 -m unittest discover -s agents/skills/project-spec-mirror/tests 通过
      must_not:
        - 在 yaml 中复制整份测试
