skill: project-spec-mirror
status: superseded

problem: |
  旧模型把 `detail_level=complete` 下的 `modules/*/notes/` 理解成 opt-in，
  导致跨文件契约写不全。该档位已删除，本提案不要再落地。

evidence:
  - experience/failures/20260829-notes-missed-in-complete-mode.md

proposal: |
  历史方案曾要求 complete 必建若干 notes。现行替代是 agent spec 的
  Requirement / Scenario，以及 briefing 总结。不要恢复 notes 必建或
  「对照同组已镜像仓」。
