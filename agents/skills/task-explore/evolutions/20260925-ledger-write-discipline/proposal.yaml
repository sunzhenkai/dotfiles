skill: task-explore

# 本提案修订自会话内 agent 提交的同名 Proposal（2026-09-24）。
# 原 Proposal 前提「生产稿在 ~/.agents/skills/、非 sync 镜像」有误，修订见 corrections。

problem: >
  SKILL.md 对 tasks/INDEX.md 与 {taskRoot}/TASK.md 的写入只有意图级约束
  （「必须同步对应行」「不抹掉仍有效的旧内容」「漂移则重建」），
  缺少写入前/写入后的机械断言。多会话、多 agent 并发写同一台账是本工作区常态，
  现有文本不足以防止破坏性写入。
  （注：index-template.md 已定义 5 列结构与排序，archive/reopen 已有「搬完自证」，
  故真实缺口是「写前写中断言」，不是「完全没有纪律」。）

evidence:
  - 2026-09-24 一轮真实任务中，8 次以上收到「目标文件自上次读取后已被并发修改」告警，
    全部发生在主文档与派生索引写入环节；凭上一轮记忆直接编辑 0 次成功。
  - 1 次：批量脚本改派生索引时匹配条件过窄（精确等值过滤），误删另一任务刚写入的索引行，
    无法自动恢复，需人工重建。
  - 1 次：改派生索引同一行未做列数断言，新内容落到错误列，该表行从 5 列变 6 列，需二次修复。
  - 1 次：条目追加到文档末尾而非目标小节，需再移动；同轮两条编号重复（均为 10），
    因追加前未读当前最大编号。
  - 0 次：上述事故由「缺少权限」或「工具不支持」造成——全是缺少写入前断言。

pattern: >
  并发台账写入的失败点固定在三处：锚点不唯一、结构未断言、编号未校验。
  三处都可用「改前一条 grep/计数 + 改后一条结构断言」当场拦住，
  是可固化为步骤的稳定模式，而非单次任务特例。

proposed_change: >
  新增 references/ledger-write-discipline.md（台账写入纪律，5 条硬步骤），
  在 SKILL.md 的「加载」节与「索引」节各加一处指向它的写时门禁；
  契约测试同步登记新 reference 并加 2 条断言。5 条硬步骤：
  1) 写前重读目标小节，锚点串出现次数恰为 1 才插入/替换，否则停；
  2) 索引行只整行替换，替换后断言列数=表头、任务前缀正确、总行数变化符合意图，
     不符则用改前整行原文改回并停止后续写入（不写「回滚」这类不可执行词）；
  3) 删除只许精确整行等值且校验行数恰减 1；批量「更新」路径不在禁列，
     但须用父路径前缀匹配并断言被改行数=子任务数（与 phase-archive/phase-reopen 既有细则一致）；
  4) 编号列表（含 decide 的 D-n）追加前先读最大编号，追加后校验无重复，整块插入目标小节末尾；
  5) 并发冲突只新增自己的块，矛盾处用显式「更正/冲突」条目+日期，不静默改写他人小节，
     无法安全合并即停（不引入 TASK.md 没有的署名格式）。
  不删除、不放宽任何既有硬规则（绑定门、父任务禁 handoff 门、确认门、archive/reopen 门禁原样保留）。

corrections:  # 相对会话内原 Proposal 的修订
  - 生产稿改判：task-explore 在仓库 agents/skills/ 下，~/.agents 与 ~/.claude 是 sync 镜像
    （两份 md5 相同，与仓库稿仅差 id 行与 {{slash}} 占位符渲染）；候选稿落仓库侧 evolutions/，不落镜像。
  - 第 3 条限定为「删除」，给 archive/reopen 批量改路径开显式口子，避免打断既有成功路径。
  - 阶段覆盖补 decide/handoff（原 Proposal 漏；重复编号事故正来自 decide 的 D-n 列表）。
  - 「回滚该行」改为可执行动作（用改前整行原文改回 + 停止 + 报告）。
  - 第 5 条去掉「标注归属」署名（task-template.md 无 author 字段），改用既有「更正/冲突」条目。
  - 内容进 references/ + 加载门禁，不塞正文；契约测试同步登记新 reference。
  - risk 由 low 上调 medium：触及批量细则冲突面与测试清单。

expected_improvement: >
  误删他任务索引行、表格结构损坏、重复编号三类事故当场被断言拦下；
  索引漂移在写入时暴露，而非事后人工重建；跨会话并发写不再静默覆盖。

risk: medium
