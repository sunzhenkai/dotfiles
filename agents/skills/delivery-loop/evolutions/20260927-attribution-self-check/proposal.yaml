skill: delivery-loop

problem: >
  Stage 8 的失败归因只有分类表，没有分类前的自检。编排者/评审者可以在
  「驳回为设计内」与「按 finding 修复」之间自由跳跃，且没有规则要求：
  (a) 连续两轮对同一 finding 给出不同解释时强制自纠；
  (b) 修复前先确认归因层次（表层验证缺失 vs 深层设计决策缺失）。

evidence:
  - 2026-09-27 同一轮交付中，同一条 finding 被连续给出两次不同解释（先驳回为设计内，再归因为验证缺口，第三次才到真根因）
  - 2026-09-27 用户连续两次追问才完成纠正，表明缺少自纠触发点
  - 2026-09-27 修复完成后未主动追问泛化性，直到用户显式点名进化流程
  - 已有 Stage 8 patch 仅堵住「驳回」出口，未覆盖「改错层次」与「改完不泛化」两个出口

pattern: >
  对同一 finding 的反复解释 = 归因未收敛的信号。表层修复（补测试锚定既有取值）
  看似回应了 finding，但一致性契约只验证「实现符合约定」，不验证「约定是否成立」。
  skill 缺少「解释不稳定就先停下做层次自检」的强制步骤。

proposed_change: >
  loop-protocol.md 的 Stage 8 增设「归因自检」，两条可执行规则：
  1. 同一 finding 若在闭环内被给出第二种解释（含驳回改修复、修复改驳回、表层修复改深层修复），
     MUST 停下重做归因，MUST NOT 沿新解释直接继续；重做后须写明前一解释为何不成立。
  2. acceptance gap 类修复 MUST 区分层次：补验证（表层）与补设计决策依据（深层）是两条
     不同路径；只在验证层修时 MUST 明确记录「设计决策依据未补」，不得默认已收敛。
  同时在 SKILL.md 主循环第 10 步补一句指向该自检的短引用。

expected_improvement: >
  把「连续两轮误判」压缩为「第一次解释不稳定即触发自检」，减少一次来回；
  防止表层修复冒充深层修复；把「改完追问泛化性」从依赖用户点名前移。

risk: medium
