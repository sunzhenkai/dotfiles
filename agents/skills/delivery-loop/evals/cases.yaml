version: 1
skill: delivery-loop
cases:
  - id: explicit-loop-orchestrates-existing-skills
    kind: core
    judge: deterministic
    description: 显式自闭环复杂目标走现有 skill 链，不发明替代流程
    given: 用户明确要求 delivery-loop 或自动探索加自动验证实现一个复杂目标
    expect:
      must:
        - 调用 task-wizard 生成质量画像与路由
        - 复杂目标经 task-explore 后交给 taskflow
        - 实施进度只认 taskflow checkbox
      must_not:
        - 自建第二份任务账本
        - 手写等价 OpenSpec / taskflow 流程

  - id: ordinary-request-does-not-activate
    kind: boundary
    judge: deterministic
    description: 未点名自动闭环的普通任务不进入 delivery-loop
    given: 用户只要求修改一个局部函数或只询问方案
    expect:
      must:
        - 退出 delivery-loop
        - 按普通任务处理
      must_not:
        - 强制多阶段编排
        - 为局部修改生成 taskflow driver

  - id: benchmark-input-isolation
    kind: core
    judge: deterministic
    description: 显式 benchmark 时实现者只收目标原文与运行约束
    given: 输入含 benchmark / 盲测 / 回归复跑
    expect:
      must:
        - 实现者 prompt 不含质量画像、rubric、期望页面清单或审阅意见
        - 审阅者持有画像与 rubric
        - 复跑使用同一份原文
      must_not:
        - 默认把普通交付当 benchmark
        - 向实现者追加事后提示

  - id: normal-delivery-context
    kind: core
    judge: deterministic
    description: normal 实现者必须拿到质量画像或保留语义的裁剪
    given: 未显式标记 benchmark 的真实交付
    expect:
      must:
        - 给实现者质量画像或子范围裁剪
        - 给本切片验收要求与运行约束
      must_not:
        - 普通任务默认盲派
        - 隐藏并发、无障碍、错误边界或运行假设

  - id: failure-three-way-triage
    kind: core
    judge: deterministic
    description: Blocker / Major 必须归因为三类之一
    given: 窄切片或全链路验证失败
    expect:
      must:
        - 逐条归因为 skill gap / implementation bug / acceptance gap
        - skill gap 走 skill-upgrader patch
        - implementation bug 修交付仓并补测试
        - acceptance gap 补验收标准
      must_not:
        - 笼统说再改改
        - 把所有失败都归因给实现

  - id: narrow-slice-first
    kind: core
    judge: deterministic
    description: 首轮只做 1-3 个核心闭环
    given: 复杂目标开始实现
    expect:
      must:
        - 先实现、测试并留证据的窄切片
        - 通过后再扩展全链路
      must_not:
        - 首轮直接铺全量功能
        - 用假数据或写死页面冒充闭环

  - id: stop-conditions
    kind: failure
    judge: deterministic
    description: 降级未确认、依赖缺失或修复两轮仍有 P0/P1 时停止
    given: 出现停止条件
    expect:
      must:
        - 停止并输出已完成、未完成、证据与下一步
        - pending 降级等待用户确认
      must_not:
        - 自动 commit / push / 部署
        - 把部分结果说成完成

  - id: evidence-before-score
    kind: core
    judge: deterministic
    description: 证据先于评分，实现者自评不算通过线
    given: 窄切片或全链路验收
    expect:
      must:
        - 先收集启动、测试、运行时证据
        - 调用 product/design/engineer 三角色评审
        - 输出五维分数与 UI/UX 六子项
      must_not:
        - 只凭实现者自评通过
        - 缺证据仍勾验收
