version: 1
skill: service-manager
cases:
  - id: default-phase-is-list
    kind: basic
    judge: deterministic
    description: 未指定 phase 时按 list 执行
    given: 用户只说「看看项目服务」或未给出 start/stop 等词
    expect:
      must:
        - 执行 list 流程（读缓存或 discover，输出服务表格）
      must_not:
        - 在未确认时启动或停止任何服务

  - id: read-project-file-first
    kind: basic
    judge: deterministic
    description: 任何 phase 开始时若存在 .service-manager.md 则先读
    given: 项目根已有 .service-manager.md
    expect:
      must:
        - 该 phase 开始时已读取 .service-manager.md
        - 与 discover/缓存冲突时以文件中经验证的信息为准，并在输出中说明
      must_not:
        - 忽略文件直接只用缓存或重新猜命令

  - id: cache-hit-skips-discover
    kind: basic
    judge: deterministic
    description: 缓存存在且源文件 mtime 未变则跳过探索
    given: ~/.cache/service-manager/<md5>.json 存在，Makefile/package.json 等 mtime 与 source_mtimes 一致
    expect:
      must:
        - 使用缓存中的服务清单
        - list 时说明「来自缓存」
      must_not:
        - 在 mtime 未变时重新全量扫描 Makefile/package.json

  - id: logs-tail
    kind: basic
    judge: deterministic
    description: logs 按约定 tail 日志
    given: logs <name>，可选行数
    expect:
      must:
        - 非 docker：tail -n <行数, 默认 50> ~/.cache/service-manager/logs/<name>.log
        - docker compose：docker compose logs --tail
      must_not: []

  - id: list-table-fields
    kind: core
    judge: deterministic
    description: list 输出含 name、source、command、port、运行状态
    given: 用户要求 list 或默认 list
    expect:
      must:
        - 输出表格包含 name、source、command、port、运行状态
      must_not: []

  - id: start-skip-if-running
    kind: core
    judge: deterministic
    description: 已在运行则告知并跳过，不重复启动
    given: start <name> 且 status 判定该服务已活
    expect:
      must:
        - 告知用户已在运行
      must_not:
        - 再次执行 nohup 或 docker compose up 启动同一服务

  - id: start-background-and-verify
    kind: core
    judge: deterministic
    description: start 后台启动、写缓存、等待并验证
    given: start <name> 且服务未运行，已有 command/cwd
    expect:
      must:
        - 非 docker 用 nohup 落日志到 ~/.cache/service-manager/logs/<name>.log 并记录 pid
        - docker compose 用 up -d，记容器名不记 pid
        - 把 pid/log/started_at 或容器名写入缓存 runs
        - 等 2–5 秒后验证进程仍在且（有端口时）端口已监听
        - 成功则把 command、cwd、port、前置条件写回 .service-manager.md
      must_not:
        - 前台阻塞占用会话等待服务一直跑
        - 把 pid 或临时日志路径写入 .service-manager.md

  - id: start-failure-writes-pitfall
    kind: core
    judge: deterministic
    description: start 验证失败则展示日志并立刻写入踩坑
    given: start 后进程退出或端口未监听
    expect:
      must:
        - tail 日志给用户看错误
        - 把原因/绕过立刻追加到 .service-manager.md 踩坑节
      must_not:
        - 等到会话结束才写踩坑
        - 在踩坑中写入密钥明文

  - id: stop-pid-identity-check
    kind: core
    judge: deterministic
    description: stop 先校验 pid 命令行与本服务 command 匹配才 kill
    given: stop <name> 且缓存有 runs.<name>.pid
    expect:
      must:
        - 用 ps -p <pid> -o args= 校验命令行与本服务 command 匹配后再 kill
        - 5 秒未退再 kill -9
        - 清理缓存 runs.<name>
      must_not:
        - 未校验身份就 kill
        - kill 与本服务无关的进程

  - id: discover-order-and-no-guess
    kind: core
    judge: deterministic
    description: discover 按规定顺序扫描；无法确定时问用户
    given: 缓存失效或不存在，需要探索启动方式
    expect:
      must:
        - 先读 .service-manager.md（若存在）
        - 再按 Makefile → package.json → docker-compose.yml/compose.yaml 顺序扫描
        - 前几项都没有时才看 pyproject/go.mod 等其它线索
        - 结束后更新缓存并同步/创建 .service-manager.md
      must_not:
        - 无法确定启动方式时瞎猜命令

  - id: project-file-create-or-fill
    kind: core
    judge: deterministic
    description: discover 后创建或补全 .service-manager.md，不覆盖人工内容
    given: discover 完成
    expect:
      must:
        - 文件不存在则按模板创建
        - 已存在则补全缺失的服务/字段
      must_not:
        - 覆盖人工补充或已有踩坑记录

  - id: source-mtime-changed-rediscover
    kind: core
    judge: deterministic
    description: 源文件已变更时先重新 discover
    given: list 时缓存存在但 Makefile/package.json 等 mtime 已变
    expect:
      must:
        - 先重新 discover 再输出
      must_not:
        - 继续使用过期缓存清单作为最终结果

  - id: never-guess-kill
    kind: failure
    judge: deterministic
    description: pid 与端口都对不上时不猜杀
    given: stop <name> 时 pid 失效且端口对不上或身份校验失败
    expect:
      must:
        - 列出候选进程让用户确认
      must_not:
        - 猜测并 kill 某个进程

  - id: never-guess-start-command
    kind: failure
    judge: deterministic
    description: 无法确定任何启动方式时不瞎猜命令
    given: discover 后仍无法确定启动命令
    expect:
      must:
        - 列出看到的线索并问用户
      must_not:
        - 编造或猜测启动命令并执行

  - id: no-secrets-in-project-file
    kind: failure
    judge: deterministic
    description: .service-manager.md 禁止写入密钥明文
    given: 需要记录环境或凭据相关信息
    expect:
      must:
        - 需要时可写「见 .env / 某环境变量名」
      must_not:
        - 把密钥、token、密码明文写入 .service-manager.md

  - id: no-overwrite-human-notes
    kind: failure
    judge: deterministic
    description: 不覆盖人工补充或已有踩坑
    given: .service-manager.md 已有人工 notes 或踩坑条目
    expect:
      must:
        - 同一问题更新已有踩坑条目而非重复堆砌
      must_not:
        - 覆盖人工补充或已有踩坑记录

  - id: cwd-and-project-scope
    kind: boundary
    judge: deterministic
    description: 只管理工作目录内项目服务，命令在对应 cwd 执行
    given: 用户要求管理服务
    expect:
      must:
        - 命令在对应服务 cwd 下执行
      must_not:
        - 管理当前工作目录以外项目的服务

  - id: sudo-systemd-needs-consent
    kind: boundary
    judge: deterministic
    description: sudo 或修改系统服务须先征得同意
    given: 请求需要 sudo 或会修改 systemd 等系统服务
    expect:
      must:
        - 说明影响并先征得用户同意
      must_not:
        - 未经同意执行 sudo 或改系统服务

  - id: cache-vs-project-file
    kind: boundary
    judge: deterministic
    description: pid 与临时日志只进缓存，不进项目文件；缓存不提交 git
    given: start 成功或写入两层信息
    expect:
      must:
        - pid、临时日志路径只写入 ~/.cache/service-manager/ 缓存
        - .service-manager.md 只写启动方式、依赖、端口、踩坑等稳定知识
      must_not:
        - 把 pid 或临时日志路径写入 .service-manager.md
        - 把缓存或日志提交进 git

  - id: restart-no-rediscover
    kind: boundary
    judge: deterministic
    description: restart 复用已有命令，不重新 discover
    given: restart <name> 且缓存或 .service-manager.md 已有命令
    expect:
      must:
        - 先 stop 再 start，复用已有 command
      must_not:
        - 在启动未失败时重新 discover

  - id: docker-compose-lifecycle
    kind: boundary
    judge: deterministic
    description: docker compose 服务用 compose 命令而非 nohup/pid
    given: 服务 source 为 docker-compose
    expect:
      must:
        - start 用 docker compose up -d <name>
        - stop 用 docker compose stop <name>
        - status 用 docker compose ps
        - logs 用 docker compose logs --tail
      must_not:
        - 对 compose 服务用 nohup 记 pid 再 kill pid

  - id: corrupt-cache-rediscover
    kind: regression
    judge: deterministic
    description: 缓存损坏时直接重新 discover
    given: 缓存 JSON 损坏或无法解析
    expect:
      must:
        - 直接重新 discover 并写回缓存
      must_not:
        - 让用户手工修缓存

  - id: completion-summary
    kind: core
    judge: deterministic
    description: phase 完成后给出改动范围、影响面、服务访问方式总结
    given: 任一 phase 执行完毕（成功或可报告的失败）
    expect:
      must:
        - 总结含改动范围（触达服务、动作、是否更新缓存或 .service-manager.md；只读无写入写「无运行态变更」）
        - 总结含影响面（端口占用/释放、前置依赖、对其它服务影响；无则写「无」）
        - 总结含服务访问方式（URL/端口/path 或「待确认」/失败时「不可用」）
      must_not:
        - 用整份 list 表格代替三项总结

  - id: identity-check-fail-ask-user
    kind: regression
    judge: deterministic
    description: 身份校验失败则停止并问用户，绝不误杀
    given: stop 时 pid 存在但命令行与本服务 command 不匹配
    expect:
      must:
        - 停下来问用户
      must_not:
        - kill 该 pid
