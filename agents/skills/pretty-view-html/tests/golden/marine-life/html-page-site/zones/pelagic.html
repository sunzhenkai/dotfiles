      <h1>大洋中上层</h1>
      <p class="lede">离开陆架后没有底可以躲。<span class="depth-chip">0–1000 m</span></p>
      <h2>真光层</h2>
      <p>浮游植物在这里固碳。金枪鱼、海龟、鲸鲨直接或间接依赖这一层。</p>
      <h2>中层带</h2>
      <p>灯笼鱼有发光器和日夜垂直洄游：白天待在黑暗里，晚上上到真光层吃饭。</p>
