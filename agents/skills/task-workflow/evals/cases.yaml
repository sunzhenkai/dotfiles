version: 1
skill: task-workflow
cases:
  - id: phase-load-one-reference
    kind: basic
    judge: deterministic
    description: 每次只读本 SKILL.md、safety.md 与当前阶段一份 reference
    given: 用户执行某一 task-* 阶段
    expect:
      must:
        - 已读 SKILL.md 与 references/safety.md
        - 只额外加载该阶段指定的 planning.md / apply.md / archive.md（design 另加 task-design）
      must_not:
        - 一次加载其他阶段正文

  - id: taskctl-mechanical-only
    kind: basic
    judge: deterministic
    description: 机械记账只通过 taskctl；stdout JSON，退出码 0/1/2
    given: 需要分配 ID、改 status、列任务、归档、读写 notes
    expect:
      must:
        - 使用 $TASKCTL（PATH 上的 taskctl 或 scripts/taskctl.py）
        - 退出码 2 时原样报告 affected/candidates/prompt 并等待
      must_not:
        - 手改 INDEX.md、工作上下文或归档移动来绕过 CLI
        - 看到退出码 2 后自行扩大授权范围

  - id: resolve-before-commands
    kind: basic
    judge: deterministic
    description: 除 task-new 外任何 command 都先 resolve
    given: task-explore / propose / apply / archive 等
    expect:
      must:
        - 先 resolve；本条或会话已有唯一 TNNNN 时显式传入
      must_not:
        - 丢掉已有焦点改走启发式

  - id: openspec-checkbox-ssot
    kind: core
    judge: deterministic
    description: OpenSpec tasks.md checkbox 是唯一进度真相
    given: 需要判断实现进度或完成度
    expect:
      must:
        - 只认 OpenSpec tasks.md 的 checkbox（status 返回统计）
        - task README 只记身份、涉及面、验收与验证
      must_not:
        - 再造第三份进度、deferred 或 checkout 真相源

  - id: id-and-layout
    kind: core
    judge: deterministic
    description: ID 由 new 扫描分配；INDEX 是派生索引
    given: task-new 或索引损坏
    expect:
      must:
        - ID 为 T + 四位数字，归档后不回收
        - slug 小写 kebab-case，由 Agent 生成不追问
        - INDEX 坏了跑 sync-index 重建
      must_not:
        - 手写 INDEX 状态字段
        - 回收已归档 ID

  - id: workflow-notes-hard-constraints
    kind: core
    judge: deterministic
    description: resolve/new 返回的 workflow_notes 视为跨任务硬约束
    given: CLI 返回非空 workflow_notes
    expect:
      must:
        - 后续阶段遵守这些约束
      must_not:
        - 忽略 workflow_notes 继续规划或 apply

  - id: no-secrets-in-task-files
    kind: core
    judge: deterministic
    description: 不写密钥只记环境变量名
    given: 写入 README、.task-workflow.md 或验证记录
    expect:
      must:
        - 需要时只记录环境变量名
      must_not:
        - 写入密钥、token 或凭证

  - id: notes-are-cross-task-only
    kind: core
    judge: deterministic
    description: .task-workflow.md 只记跨任务仍有效的约定
    given: 用户给出稳定约定或单次需求
    expect:
      must:
        - 稳定约定用 notes --set-section 更新
        - 单次需求、验收和方案写 task README
      must_not:
        - 把单次需求写进 .task-workflow.md
        - 往 notes 写入凭证

  - id: exit-2-wait-user
    kind: failure
    judge: deterministic
    description: 退出码 2 必须等待用户，确认后按 CLI 返回参数重跑
    given: resolve 不唯一，或 validate-round-end / archive 返回退出码 2
    expect:
      must:
        - 原样报告 CLI 的 affected/candidates/prompt
        - validate-round-end 用同一 $TASKCTL 加 confirm_args 重跑
      must_not:
        - 自行扩大授权范围或把退出码 2 当硬失败直接结束

  - id: no-heuristic-when-id-known
    kind: failure
    judge: deterministic
    description: 已有唯一 TNNNN 时不得丢掉焦点改走启发式（RES-1）
    given: 本条或本会话已有唯一 TNNNN / task 路径
    expect:
      must:
        - 显式传给 resolve
      must_not:
        - 改用 status/关键词启发式匹配

  - id: no-checkout-in-planning
    kind: failure
    judge: deterministic
    description: 规划阶段不为 task 分支 fetch/checkout（PLAN-1）
    given: task-new / explore / design / propose
    expect:
      must:
        - 工作上下文保持「尚未准备」
      must_not:
        - 为 task 分支运行 fetch/checkout

  - id: no-auto-stash-on-dirty
    kind: failure
    judge: deterministic
    description: dirty 或 fetch 失败 fail closed，禁止自动 stash/reset/force（CHECKOUT-2）
    given: apply 准备仓库时非目标分支 dirty 或 origin fetch 失败
    expect:
      must:
        - fail closed 并等用户处理；已准备成功的仓保留
      must_not:
        - 自动 stash、reset 或 force checkout

  - id: task-design-optional
    kind: boundary
    judge: deterministic
    description: task-design 仅用于新子系统、多方案或跨模块契约
    given: 局部且路径唯一的任务
    expect:
      must:
        - 跳过 design，从 explore 或直接 propose
      must_not:
        - 为路径唯一的局部改动强制走 task-design

  - id: scope-roles
    kind: boundary
    judge: deterministic
    description: 涉及面角色只有必须/建议/排除；prepare-branches 只切必须仓
    given: apply 准备仓库或归档
    expect:
      must:
        - 必须仓会修改并切分支；建议只读参考；排除不碰
      must_not:
        - 把 cwd、建议仓或排除仓自动加入 prepare-branches
        - 未知角色时猜默认值

  - id: archive-exit-2-is-confirm
    kind: boundary
    judge: deterministic
    description: 归档 dry-run 退出码 2 是待确认不是失败（ARCH-1）
    given: archive --dry-run 因 checkbox 未完、验收未勾或交付仓 dirty 返回 2
    expect:
      must:
        - 逐条报给用户问是否继续
        - 仅在逐条确认后传 --confirmed
      must_not:
        - 自行判成不能归档就结束
        - change 未归档前 finalize

  - id: existing-tests-still-pass
    kind: regression
    judge: deterministic
    description: 现有 taskctl 与契约测试仍通过
    given: 本 skill 的 tests/ 存在
    expect:
      must:
        - tests/test_skill_contract.py 与 tests/test_taskctl.py 相关测试仍通过
      must_not:
        - 改 safety.md 规则却不同步改测试

  - id: apply-round-end-five-only
    kind: regression
    judge: deterministic
    description: apply 只有五种情况允许结束本轮（APPLY-1）
    given: apply 处理完一项后判断是否继续
    expect:
      must:
        - 仅在 remaining 全勾、预算耗尽、需用户决策、经确认的全局阻塞、全局故障时结束
        - 结束前跑 validate-round-end
      must_not:
        - 因汇报点、单项暂缓或委托失败结束本轮
        - 把未判定项说成暂缓

  - id: openspec-delegation-bound
    kind: regression
    judge: deterministic
    description: 委托 openspec 必须在 planning_root 下且显式传 change name（PROXY-1）
    given: 委托 openspec-* 或直调 openspec CLI
    expect:
      must:
        - 在该 target 的 planning_root 下执行且显式传 change name
        - skill 未安装时停下报告（archive 按 archive.md CLI 直调）
      must_not:
        - 缺绑定仍委托
        - 自行发明等价命令
