# Codex 配置 - 默认直连 MiniMax（MiniMax-M3）
# 文档: https://developers.openai.com/codex/config-reference
#
# 自定义 provider（均 requires_openai_auth = false，启动跳过 ChatGPT 登录）：
#   minimax  — MiniMax 国内站（默认）  MINIMAX_API_KEY
#   nativex  — 公司 newapi 网关        NATIVEX_API_KEY
#   kimi     — Kimi For Coding         KIMI_API_KEY
#   zhipu    — 智谱 GLM Coding Plan    ZHIPU_API_KEY
#   scnet    — 超算互联网 Token Plan    SCNET_API_KEY
#
# 切换默认 provider：dotf codex -c -f <name>（或 --profile <name>）
# 单次会话：codex --profile <name>
# 模型切换：TUI /model 或 codex exec -m <slug>（catalog 为数据源）
#
# 注意: codex 0.130+ 仅支持 wire_api = "responses"。

# ============================================================
# 顶级配置（必须在任何 [table] 头之前）
# ============================================================
model = "MiniMax-M3"
model_provider = "minimax"
model_context_window = 1000000
# 模型能力目录：声明 MiniMax-M3 的多模态输入、reasoning level、工具类型等。
# 安装后位于 ~/.codex/model-catalogs/custom-catalog.json（symlink 到本仓库文件）。
# 切回 NativeX 时由 nativex profile 覆盖为 nativex-catalog.json。
model_catalog_json = "~/.codex/model-catalogs/custom-catalog.json"

# 审批策略: untrusted | on-request | never
approval_policy = "on-request"
# 沙箱模式: read-only | workspace-write | danger-full-access
sandbox_mode = "workspace-write"

# 隐藏冗长的推理输出（CI 日志更清爽）
hide_agent_reasoning = true
model_reasoning_effort = "high"

# ============================================================
# 自定义模型提供商 - MiniMax（默认）
# ============================================================
# 认证通过 env_key 从 MINIMAX_API_KEY 环境变量读取，无需在此硬编码密钥。
# wire_api = "responses"：MiniMax Code Companion 提供 Responses API 协议。
# requires_openai_auth = false：显式声明不要求 OpenAI 登录（默认即 false，
#   启动时直接跳过 ChatGPT 登录选择器）。
# 国内站 api.minimaxi.com（不是海外站 api.minimax.io）。
[model_providers.minimax]
name = "MiniMax"
base_url = "https://api.minimaxi.com/v1"
env_key = "MINIMAX_API_KEY"
wire_api = "responses"
requires_openai_auth = false

# ============================================================
# 自定义模型提供商 - NativeX（备用，--profile nativex 激活）
# ============================================================
# ailink.nativex.com 是 newapi 网关，/v1/responses 端点已验证可用。
# 认证通过 env_key 从 NATIVEX_API_KEY 环境变量读取（senv ai 组）。
# 注意：验证网关模型必须用 codex 真跑（codex exec -m <model>），裸 curl 简单请求
# 不会触发网关的 Responses→chat 协议转换，会误判"不可用"（2026-08-20 踩坑）。
[model_providers.nativex]
name = "NativeX"
base_url = "https://ailink.nativex.com/v1"
env_key = "NATIVEX_API_KEY"
wire_api = "responses"
requires_openai_auth = false

# ============================================================
# 自定义模型提供商 - Kimi For Coding
# ============================================================
# 官方 Base URL 为 Chat Completions；Codex 仍发 /v1/responses。
# 若直连失败，需 Responses 网关（如 CC Switch）做协议转换。
[model_providers.kimi]
name = "Kimi"
base_url = "https://api.kimi.com/coding/v1"
env_key = "KIMI_API_KEY"
wire_api = "responses"
requires_openai_auth = false

# ============================================================
# 自定义模型提供商 - 智谱 GLM Coding Plan（open.bigmodel.cn）
# ============================================================
# 官方 Codex 端点为 OpenAI Responses：https://open.bigmodel.cn/api/v1
# （Chat Completions 套餐端点 /api/coding/paas/v4 不能给现行 Codex 直连）
[model_providers.zhipu]
name = "Zhipu Coding Plan"
base_url = "https://open.bigmodel.cn/api/v1"
env_key = "ZHIPU_API_KEY"
wire_api = "responses"
requires_openai_auth = false

# ============================================================
# 自定义模型提供商 - SCNet（超算互联网）
# ============================================================
# OpenAI 兼容（含 Responses）：https://api.scnet.cn/api/llm/v1
# Anthropic 兼容（Codex 不用）：https://api.scnet.cn/api/llm/anthropic
# 官方文档 env 名为 SCNET_TOKEN_PLAN_API_KEY；本仓库统一 SCNET_API_KEY。
[model_providers.scnet]
name = "SCNet"
base_url = "https://api.scnet.cn/api/llm/v1"
env_key = "SCNET_API_KEY"
wire_api = "responses"
requires_openai_auth = false

# profile 层不在本文件（codex 0.134+ 已废弃 [profiles.<name>] 表），
# 而是独立文件 <name>.config.toml，安装到 ~/.codex/<name>.config.toml，
# 用 codex --profile <name> 或 dotf codex -f <name> 切换。

# ============================================================
# 子进程环境变量策略
# ============================================================
[shell_environment_policy]
inherit = "core"

# ============================================================
# TUI 通知
# ============================================================
[tui]
notifications = ["agent-turn-complete", "approval-requested"]

# ============================================================
# projects（信任的项目列表）不在本文件管理
# ============================================================
# codex 运行时会把"首次信任的项目"以 [projects."<path>"] 形式自动写入
# ~/.codex/config.toml。这类内容机器特定、动态变化，放进本仓库会污染 git。
#
# 方案：projects 由本地文件 codex/config.local.toml 维护（已 .gitignore），
# 安装时（`dotf codex`）自动与本文件（base）合并生成 ~/.codex/config.toml。
# codex 新增的信任会在下次安装时自动回抽到 config.local.toml，不丢也不入库。
# 详见 codex/README.md「projects 本地化」一节。
