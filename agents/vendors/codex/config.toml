# Codex 配置 - 基础配置（base），安装时与 XDG overlay 合并生成 ~/.codex/config.toml
# 文档: https://developers.openai.com/codex/config-reference
#
# 本仓库不再声明 LLM provider / 模型 / 密钥；运行时 provider 配置请走
# ${XDG_CONFIG_HOME:-$HOME/.config}/dotf/overlays/*.yaml 的 codex.local_toml。

# ============================================================
# 顶级配置（必须在任何 [table] 头之前）
# ============================================================

# 审批策略: untrusted | on-request | never
approval_policy = "on-request"
# 沙箱模式: read-only | workspace-write | danger-full-access
sandbox_mode = "workspace-write"

# ============================================================
# 子进程环境变量策略
# ============================================================
[shell_environment_policy]
inherit = "core"

# ============================================================
# TUI 通知
# ============================================================
[tui]
notifications = ["agent-turn-complete", "approval-requested"]

# ============================================================
# projects（信任的项目列表）不在本文件管理
# ============================================================
# codex 运行时会把"首次信任的项目"以 [projects."<path>"] 形式自动写入
# ~/.codex/config.toml。这类内容机器特定、动态变化，放进本仓库会污染 git。
#
# 方案：projects 等本机配置仅在
# ${XDG_CONFIG_HOME:-$HOME/.config}/dotf/overlays/*.yaml 的 codex.local_toml
# 中维护；`dotf codex -c` 将其与本文件（base）合并到 ~/.codex/config.toml。
# 旧仓库内 config.local.toml 仅作为只读迁移输入，不再回抽或写入。
# 详见 codex/README.md「projects 本地化」一节。
