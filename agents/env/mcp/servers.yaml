# 共享 MCP server 真相源（不内联密钥）
version: 1

servers:
  web-search-prime:
    transport: streamable-http
    url: https://open.bigmodel.cn/api/mcp/web_search_prime/mcp
    auth:
      type: bearer-env
      env: ZHIPU_API_KEY
    tools: [cursor, kiro, opencode, kimi-code, zcode]
    profiles: [research, browser, full]
    risk: low
    required_tools: []

  web-reader:
    transport: streamable-http
    url: https://open.bigmodel.cn/api/mcp/web_reader/mcp
    auth:
      type: bearer-env
      env: ZHIPU_API_KEY
    tools: [cursor, kiro, opencode, kimi-code, zcode]
    profiles: [research, browser, full]
    risk: low
    required_tools: []

  zread:
    transport: streamable-http
    url: https://open.bigmodel.cn/api/mcp/zread/mcp
    auth:
      type: bearer-env
      env: ZHIPU_API_KEY
    tools: [cursor, kiro, opencode, kimi-code, zcode]
    profiles: [research, browser, full]
    risk: low
    required_tools: []

  playwright:
    transport: stdio
    command: npx
    args: ["-y", "@playwright/mcp@latest", "--browser", "chromium"]
    tools: [cursor, kiro, opencode, kimi-code, zcode]
    profiles: [browser, full]
    risk: high
    required_tools: [node, npx]
    # 默认追加参数由 sync 根据 browser.yaml / local override 生成
    browser_provider: playwright

  # 智谱视觉理解 MCP（@z_ai/mcp-server）
  # stdio 启动，进程读 Z_AI_API_KEY；token 从 ZHIPU_API_KEY 读取，不必单独 export。
  # Cursor/Kiro 展开 ${ZHIPU_API_KEY}；OpenCode 转成 {env:ZHIPU_API_KEY}；
  # ZCode 由 sync 把占位符展开进 ~/.zcode/cli/config.json；
  # Kimi 不展开 ${VAR}，stdio 渲染为 sh -c 在启动时映射 ZHIPU_API_KEY。
  zai-vision:
    transport: stdio
    command: npx
    args: ["-y", "@z_ai/mcp-server@latest"]
    env:
      Z_AI_API_KEY: ${ZHIPU_API_KEY}
      Z_AI_MODE: ZHIPU
    tools: [cursor, kiro, opencode, kimi-code, zcode]
    profiles: [research, browser, full]
    risk: low
    required_tools: [node, npx]
