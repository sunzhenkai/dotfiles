$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://github.com/sunzhenkai/dotfiles/agents/env/overlay.schema.yaml"
title: dotf external overlay
additionalProperties: false
required: [schema_version, kind]
type: object
properties:
  schema_version:
    const: 1
  kind:
    const: dotf-overlay
  agents:
    additionalProperties: false
    type: object
    properties:
      profile:
        enum: [coding, research, full]
      enabled_skills:
        type: array
        uniqueItems: true
        items: {type: string}
      disabled_skills:
        type: array
        uniqueItems: true
        items: {type: string}
  codex:
    additionalProperties: false
    type: object
    properties:
      local_toml: {type: string}
