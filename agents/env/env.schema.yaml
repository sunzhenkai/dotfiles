# 环境变量 schema：只声明名称与规则，不存放真实密钥
version: 1

variables:
  ZHIPU_API_KEY:
    purpose: "智谱 AI API Key；用于 MCP 鉴权，以及 Codex zhipu / GLM Coding Plan provider"
    required: true
    sensitive: true
    profiles: [research, browser, full]
    check: present
    setup_hint: "在 ~/.envrc 或 shell 配置中 export ZHIPU_API_KEY=...；dotf codex -f zhipu 切 Codex"

  Z_AI_API_KEY:
    purpose: "@z_ai/mcp-server（视觉理解 MCP）读取的密钥；servers.yaml 的 zai-vision 通过 ${ZHIPU_API_KEY} 映射到本变量。不必单独 export，依赖 ZHIPU_API_KEY 即可"
    required: false
    sensitive: true
    profiles: [research, browser, full]
    tools: [claude, cursor, kiro, opencode, kimi-code, zcode, qoder, codebuddy-code]
    check: present
    setup_hint: "通常从 ZHIPU_API_KEY 映射：Claude/Cursor/Kiro 展开 ${ZHIPU_API_KEY}；OpenCode 用 {env:ZHIPU_API_KEY}；Kimi 用 sh -c 在启动时映射；ZCode 由 sync 把密钥写入本机 ~/.zcode/cli/config.json；如需手动 export: export Z_AI_API_KEY=\"$ZHIPU_API_KEY\""

  MINIMAX_API_KEY:
    purpose: "MiniMax API Key；本库约定为国内站 key（Codex + OpenCode + Pi auth.json 展开）"
    required: false
    sensitive: true
    profiles: [coding, research, browser, full]
    tools: [codex, opencode, pi]
    check: present
    setup_hint: "在 ~/.envrc 中 export MINIMAX_API_KEY=...；dotf pi -c 会写入 auth.json 引用，无需再设 MINIMAX_CN_API_KEY"

  MINIMAX_CN_API_KEY:
    purpose: "可选：Pi 原生国内站 env（若未用 auth.json 的 $MINIMAX_API_KEY）"
    required: false
    sensitive: true
    profiles: [coding, research, browser, full]
    tools: [pi]
    check: present
    setup_hint: "通常不必设；需要时可 export MINIMAX_CN_API_KEY=\"$MINIMAX_API_KEY\""

  KIMI_API_KEY:
    purpose: "Kimi For Coding API Key；Pi 内置 provider kimi-coding，以及 Codex / OpenCode kimi provider"
    required: false
    sensitive: true
    profiles: [coding, research, browser, full]
    tools: [codex, opencode, pi]
    check: present
    setup_hint: "在 ~/.envrc 中 export KIMI_API_KEY=...；dotf pi -c 会写入 auth.json 引用；dotf codex -f kimi / dotf opencode -f kimi"

  NATIVEX_API_KEY:
    purpose: "NativeX 网关 API Key；Codex / OpenCode nativex provider"
    required: false
    sensitive: true
    profiles: [coding, research, browser, full]
    tools: [codex, opencode]
    check: present
    setup_hint: "senv env set NATIVEX_API_KEY ... -g ai 后 eval $(senv env export)"

  SCNET_API_KEY:
    purpose: "SCNet（超算互联网）模型 API Key；Codex / OpenCode scnet provider（官方文档亦称 SCNET_TOKEN_PLAN_API_KEY）"
    required: false
    sensitive: true
    profiles: [coding, research, browser, full]
    tools: [codex, opencode]
    check: present
    setup_hint: "export SCNET_API_KEY=... 后 dotf codex -f scnet 或 dotf opencode -f scnet；若只有官方名可 alias：export SCNET_API_KEY=\"$SCNET_TOKEN_PLAN_API_KEY\""

  COMPANY_API_KEY:
    purpose: "公司 new-api 令牌；Codex / OpenCode company provider（约定存在 senv feg 组）"
    required: false
    sensitive: true
    profiles: [coding, research, browser, full]
    tools: [codex, opencode]
    check: present
    setup_hint: "senv env set COMPANY_API_KEY ... -g feg 后 eval $(senv env export)；dotf opencode -f company"

  COMPANY_BASE_URL:
    purpose: "公司 new-api OpenAI 兼容 Base URL（须含 /v1）；Codex 安装时展开，OpenCode 运行时读 {env:COMPANY_BASE_URL}，均不入库"
    required: false
    sensitive: true
    profiles: [coding, research, browser, full]
    tools: [codex, opencode]
    check: present
    setup_hint: "senv env set COMPANY_BASE_URL ... -g feg 后 dotf codex -c / dotf opencode -c"

  AGENT_ENV_BROWSER_EXECUTABLE:
    purpose: "可选：覆盖浏览器可执行文件路径"
    required: false
    sensitive: false
    profiles: [browser, full]
    check: present_if_set
    setup_hint: "仅在 local override 或环境变量中设置本机路径"

  AGENT_ENV_CDP_ENDPOINT:
    purpose: "可选：Chrome DevTools Protocol endpoint（如 http://127.0.0.1:9222）"
    required: false
    sensitive: false
    profiles: [browser, full]
    check: present_if_set
    setup_hint: "仅在显式启用 chrome-devtools provider 时设置"
