# 环境变量 schema：只声明名称与规则，不存放真实密钥
version: 1

variables:
  ZHIPU_API_KEY:
    purpose: "智谱 AI API Key；用于 Codex zhipu / GLM Coding Plan provider 与 OpenCode zhipu provider"
    required: true
    sensitive: true
    profiles: [research, full]
    check: present
    setup_hint: "在 ~/.envrc 或 shell 配置中 export ZHIPU_API_KEY=..."

  MINIMAX_API_KEY:
    purpose: "MiniMax API Key；本库约定为国内站 key（Codex + OpenCode + Pi auth.json 展开）"
    required: false
    sensitive: true
    profiles: [coding, research, full]
    tools: [codex, opencode, pi]
    check: present
    setup_hint: "在 ~/.envrc 中 export MINIMAX_API_KEY=...；dotf pi -c 会写入 auth.json 引用，无需再设 MINIMAX_CN_API_KEY"

  MINIMAX_CN_API_KEY:
    purpose: "可选：Pi 原生国内站 env（若未用 auth.json 的 $MINIMAX_API_KEY）"
    required: false
    sensitive: true
    profiles: [coding, research, full]
    tools: [pi]
    check: present
    setup_hint: "通常不必设；需要时可 export MINIMAX_CN_API_KEY=\"$MINIMAX_API_KEY\""

  KIMI_API_KEY:
    purpose: "Kimi For Coding API Key；Pi 内置 provider kimi-coding，以及 Codex / OpenCode kimi provider"
    required: false
    sensitive: true
    profiles: [coding, research, full]
    tools: [codex, opencode, pi]
    check: present
    setup_hint: "在 ~/.envrc 中 export KIMI_API_KEY=...；dotf pi -c 会写入 auth.json 引用"

  SCNET_API_KEY:
    purpose: "SCNet（超算互联网）模型 API Key；Codex / OpenCode scnet provider（官方文档亦称 SCNET_TOKEN_PLAN_API_KEY）"
    required: false
    sensitive: true
    profiles: [coding, research, full]
    tools: [codex, opencode]
    check: present
    setup_hint: "export SCNET_API_KEY=...；若只有官方名可 alias：export SCNET_API_KEY=\"$SCNET_TOKEN_PLAN_API_KEY\""

  DEEPSEEK_API_KEY:
    purpose: "DeepSeek 官方 API Key；Codex / OpenCode deepseek provider"
    required: false
    sensitive: true
    profiles: [coding, research, full]
    tools: [codex, opencode]
    check: present
    setup_hint: "senv env set DEEPSEEK_API_KEY ... -g ai 后 eval $(senv env export)"
