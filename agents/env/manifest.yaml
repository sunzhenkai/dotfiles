# agents/env 环境清单：支持工具、默认 profile、模块范围
version: 1

tools:
  - cursor
  - kiro
  - opencode
  - codex
  - kimi-code
  - pi
  - zcode
  - dsh

default_profile: browser

modules:
  mcp:
    enabled: true
    tools: [cursor, kiro, opencode, kimi-code, zcode]
    exclude: [codex, pi]
  browser:
    enabled: true
    tools: [cursor, kiro, opencode, kimi-code, zcode]
    exclude: [codex, pi]
  tools:
    enabled: true
    tools: [cursor, kiro, opencode, codex, kimi-code, pi, zcode]
  env:
    enabled: true
    tools: [cursor, kiro, opencode, codex, kimi-code, pi, zcode]
  security:
    enabled: true
    tools: [cursor, kiro, opencode, codex, kimi-code, pi, zcode]
  agents:
    enabled: true
    tools: [cursor, kiro, opencode, codex, kimi-code, pi, zcode]

# Codex / Pi / DSH 当前无 agents/env 聚合 MCP 配置入口，显式降级
unsupported:
  codex:
    mcp: skip
    reason: "Codex 当前无稳定 MCP 配置入口；skills 仍由 agents/ 同步"
  pi:
    mcp: skip
    reason: "Pi 无内置 MCP（可用 skills/extensions）；skills 仍由 agents/ 同步"
  dsh:
    mcp: skip
    reason: "DSH 的 MCP client 配置在 profile 内（$DSH_HOME/profiles/<name>）"
