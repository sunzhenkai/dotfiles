# agents/env 环境清单：支持工具、默认 profile、模块范围
version: 1

tools:
  - claude
  - cursor
  - opencode
  - codex
  - kimi-code
  - pi
  - zcode
  - qoder
  - codebuddy-code
  - minimax

default_profile: browser

modules:
  mcp:
    enabled: true
    tools: [claude, cursor, opencode, kimi-code, zcode, qoder, codebuddy-code]
    exclude: [codex, pi, minimax]
  browser:
    enabled: true
    tools: [claude, cursor, opencode, kimi-code, zcode, qoder, codebuddy-code]
    exclude: [codex, pi, minimax]
  tools:
    enabled: true
    tools: [claude, cursor, opencode, codex, kimi-code, pi, zcode, qoder, codebuddy-code, minimax]
  env:
    enabled: true
    tools: [claude, cursor, opencode, codex, kimi-code, pi, zcode, qoder, codebuddy-code, minimax]
  security:
    enabled: true
    tools: [claude, cursor, opencode, codex, kimi-code, pi, zcode, qoder, codebuddy-code, minimax]
  agents:
    enabled: true
    tools: [claude, cursor, opencode, codex, kimi-code, pi, zcode, qoder, codebuddy-code, minimax]

# Codex / Pi / MiniMax 当前无稳定 MCP 配置入口，显式降级
unsupported:
  codex:
    mcp: skip
    reason: "Codex 当前无稳定 MCP 配置入口；skills/commands 仍由 agents/ 同步"
  pi:
    mcp: skip
    reason: "Pi 无内置 MCP（可用 skills/extensions）；skills/prompts 仍由 agents/ 同步"
  minimax:
    mcp: skip
    reason: "MiniMax CLI（mmx）无 MCP 配置入口；亦无 skills/commands 布局，不参与 agents/ 同步"
