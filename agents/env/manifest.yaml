# agents/env 环境清单：支持工具、默认 profile、模块范围
version: 1

tools:
  - cursor
  - kiro
  - opencode
  - codex
  - kimi-code
  - pi
  - zcode
  - dsh

default_profile: research

modules:
  tools:
    enabled: true
    tools: [cursor, kiro, opencode, codex, kimi-code, pi, zcode]
    exclude: []
  env:
    enabled: true
    tools: [cursor, kiro, opencode, codex, kimi-code, pi, zcode]
    exclude: []
  security:
    enabled: true
    tools: [cursor, kiro, opencode, codex, kimi-code, pi, zcode]
    exclude: []
  agents:
    enabled: true
    tools: [cursor, kiro, opencode, codex, kimi-code, pi, zcode]
    exclude: []
