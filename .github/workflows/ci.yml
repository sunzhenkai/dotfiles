name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux mandatory gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.12"
      - name: Install pinned Python and shell dependencies
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.3 pytest==9.1.1
          sudo apt-get update
          sudo apt-get install --yes shellcheck=0.9.0-1
          shellcheck --version | grep -F "version: 0.9.0"
      - name: Run strict local CI contract
        run: make ci

  macos-bash32:
    name: macOS system Bash 3.2 acceptance
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        shell: /bin/bash {0}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.12"
      - name: Install pinned runtime dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Assert system Bash 3.2 and run migration smoke
        run: /bin/bash scripts/ci/smoke-macos.sh
